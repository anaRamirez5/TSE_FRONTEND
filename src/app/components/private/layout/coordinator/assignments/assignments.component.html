<div class="d-flex flex-column container-fluid">
  <app-filters role="programmer_assign"></app-filters>
  <table
    class="table-responsive-md table-responsive-lg table-responsive-xl bg-white table-responsive-xxl rounded-top-3"
  >
    <thead class="rounded-3">
      <tr>
        <th scope="col">Fecha del servicio</th>
        <th scope="col">Hora destino</th>
        <th scope="col">Placa</th>
        <th scope="col">Dirreción de origen</th>
        <th scope="col">Dirreción de destino</th>
        <th scope="col">Departamento</th>
        <th scope="col">Municipio</th>
        <th scope="col">Estado</th>
        <th scope="col-1"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>row.date || "--"</td>
        <td>row.hour_start || "--"</td>
        <td>row.hour_end || "--"</td>
        <td>row.license_plate_number || "--"</td>
        <td placement="top" containerClass="custom-tooltip">
          row.adress_start || "--"
        </td>
        <td placement="top" containerClass="custom-tooltip">
          row.adress_end || "--"
        </td>
        <td>row.departament || "--"</td>
        <td>
          <div class="tag reject mx-3">Rechazado</div>
        </td>
        <td>
          <button
            class="rounded-circle edit_assign"
            (click)="editDriverAssign()"
          >
            <img
              src="../../../../../../assets/images/edit.svg"
              alt=""
              style="width: 13px; vertical-align: unset"
            />
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="bg-white rounded-bottom-3">
    <app-paginator
      [itemsPerPage]="10"
      [totalItems]="90"
      [currentPage]="1"
    ></app-paginator>
  </div>
</div>

<app-edit-asign></app-edit-asign>
