<div class="d-flex flex-column container-fluid">
  <button
    (click)="acceptRoute()"
    style="position: fixed; bottom: 2%; right: 5%; z-index: 1"
    class="rounded-5 btn btn-success px-2"
    [ngClass]="{ 'd-none': handleRoute }"
  >
    <img
      style="width: 30px"
      src="../../../../../assets/images/check-driver.svg"
      alt=""
    />
    Aceptar ruta completa
  </button>
  @if(finalResponse){
  <div class="spinner-overlay">
    <div class="spinner-border text-info" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
  } @for (row of historyTable; track row ) {
  <app-accordion-asign-driver
    [handleButtons]="handleRoute"
    [data]="row"
  ></app-accordion-asign-driver>
  }
</div>
