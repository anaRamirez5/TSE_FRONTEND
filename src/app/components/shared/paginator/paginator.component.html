<nav aria-label="Page navigation example" class="p-2">
  <ul class="pagination justify-content-end">
    <li class="page-item disabled" [class.disabled]="currentPage === 1">
      <a class="page-link" [class.disabled]="currentPage === 1">Previous</a>
    </li>
    <li
      class="page-item"
      *ngFor="let page of pages"
      [class.active]="page === currentPage"
    >
      <a class="page-link" (click)="changePage(page)" href="#">{{ page }}</a>
    </li>
    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <a class="page-link" (click)="changePage(currentPage + 1)" href="#"
        >Next</a
      >
    </li>
  </ul>
</nav>
