<div
  class="toast"
  [ngClass]="{ error: !result(), success: result() }"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
>
  <div class="toast-body">
    {{
      result()
        ? "Reasignación realizada con exito."
        : "No se encontraron resultados para los criterios seleccionados."
    }}
  </div>
</div>
